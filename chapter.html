<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الدروس — ASCEND</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/chapter.css">
</head>
<body>

<div class="app">
  <!-- السايدبار -->
  <aside class="sidebar" id="sidebar">
    <a href="/" class="sidebar-brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M7 17L17 7M17 7H9M17 7v8"/></svg></span>
      ASCEND
    </a>
    <div class="sidebar-bottom">
      <div class="user-card">
        <div class="user-card-avatar" id="userAvatar">؟</div>
        <div class="user-card-info"><div class="user-card-name" id="userName">…</div></div>
      </div>
    </div>
  </aside>

  <!-- المحتوى الرئيسي -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <a href="javascript:history.back()" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></a>
        <div class="topbar-title" id="pageTitle">جاري التحميل...</div>
      </div>
    </header>

    <main class="content">
      
      <!-- مشغل الفيديو (يظهر ويختفي حسب الضغط) -->
      <div id="videoSection" class="video-section" style="display: none;">
        <div class="video-wrapper">
          <div id="videoContainer"></div>
        </div>
        <div class="video-actions">
          <button id="markCompleteBtn" class="btn btn-primary">تحديد كمكتمل ✓</button>
        </div>
      </div>

      <!-- قائمة الدروس (الأكورديون) -->
      <div class="lessons-section">
        <h2 class="section-title" id="chapterTitle">...</h2>
        <div id="lessonsList" class="lessons-list">
          <div class="loading-inline">جاري التحميل…</div>
        </div>
      </div>

    </main>
  </div>
</div>

<script type="module" src="/assets/js/chapter.js"></script>
</body>
</html>
