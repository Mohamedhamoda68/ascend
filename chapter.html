<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>محتوى الباب — ASCEND</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/chapter.css">
</head>
<body>

<div class="app">
  <!-- المحتوى الرئيسي -->
  <div class="main">
    <main class="content">

      <!-- 1. صورة الغلاف الكبيرة (زي الصورة الأولى) -->
      <div class="cover-image-wrapper">
        <div class="cover-bg" id="chapterCover"></div>
      </div>

      <!-- 2. قسم الدروس (زي الصورة التانية) -->
      <div class="lessons-section">
        <h2 class="section-title">الدروس</h2>
        
        <div class="lessons-list" id="lessonsList">
          <!-- الكروت هتتولد هنا بالـ JS، بس ده شكلها -->
          <div class="lesson-card">
            <div class="lesson-header">
              <div class="lesson-info">
                <span class="lesson-title">الاسبوع الاول</span>
                <span class="lesson-subtitle">مقدمه عن العناصر الانتقالية</span>
              </div>
              <div class="lesson-arrow">
                <svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 3. الفوتر (زي الصورة الثالثة) -->
      <footer class="site-footer">
        <div class="footer-logo">
          <svg viewBox="0 0 24 24"><path d="M7 17L17 7M17 7H9M17 7v8"/></svg>
          ASCEND
        </div>
        <div class="footer-text">
          جميع الحقوق محفوظة © 2024
        </div>
        <div class="footer-links">
          <a href="#">الشروط والأحكام</a>
          <a href="#">سياسة الخصوصية</a>
        </div>
      </footer>

    </main>
  </div>
</div>

<script type="module" src="/assets/js/chapter.js"></script>
</body>
</html>
