<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">

<title>تسجيل الدخول — ASCEND</title>
<meta name="description" content="سجّل دخولك إلى منصة ASCEND التعليمية.">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap">

<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/layout.css">
<link rel="stylesheet" href="/assets/css/login.css">
</head>
<body>

<div class="auth-wrap">

  <div class="auth-card">

    <a href="/" class="brand" style="justify-content:center;margin-bottom:24px;display:flex">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M7 17L17 7M17 7H9M17 7v8"/></svg>
      </span>
      ASCEND
    </a>

    <!-- LOGIN FORM -->
    <div id="loginSection">
      <h1 style="text-align:center">مرحبًا بعودتك</h1>
      <p class="sub" style="text-align:center">سجّل دخولك لمتابعة رحلتك التعليمية</p>

      <div class="alert alert-error" id="alert" role="alert"></div>

      <form id="loginForm" novalidate>

        <div class="field" id="emailField">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
          <div class="error-msg">يرجى إدخال بريد إلكتروني صحيح</div>
        </div>

        <div class="field" id="passwordField">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
          <div class="error-msg">كلمة المرور مطلوبة</div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;margin:16px 0 20px;font-size:13px">
          <label style="display:inline-flex;align-items:center;gap:8px;color:var(--fg-2);cursor:pointer">
            <input type="checkbox" name="remember" style="width:16px;height:16px;accent-color:var(--accent);cursor:pointer">
            تذكّرني
          </label>
          <a href="/forgot-password.html" style="color:var(--accent-fg);font-weight:600;text-decoration:none">نسيت كلمة المرور؟</a>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%;height:44px">
          <span>تسجيل الدخول</span>
        </button>

      </form>

      <div class="auth-foot">
        ليس لديك حساب؟ <a href="/register.html">إنشاء حساب جديد</a>
      </div>
    </div>

    <!-- ROLE PICKER (for multi-role accounts) -->
    <div id="rolePickerSection" style="display:none">
      <div class="role-picker-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a2 2 0 012 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 017 7h1a1 1 0 011 1v3a1 1 0 01-1 1h-1v1a2 2 0 01-2 2H5a2 2 0 01-2-2v-1H2a1 1 0 01-1-1v-3a1 1 0 011-1h1a7 7 0 017-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 012-2z"/>
        </svg>
      </div>

      <h2 style="text-align:center;font-size:22px;font-weight:800;margin-bottom:8px">اختر الواجهة</h2>
      <p class="sub" style="text-align:center;margin-bottom:28px">
        حسابك عنده أكتر من صلاحية — اختار إنت عايز تدخل بأنهي واجهة
      </p>

      <div class="role-picker">
        <button type="button" class="role-option" data-target="/admin.html" data-color="admin">
          <div class="role-option-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/>
              <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9"/>
            </svg>
          </div>
          <div class="role-option-label">لوحة الإدارة</div>
          <div class="role-option-desc">تحكم كامل في المنصة</div>
        </button>

        <button type="button" class="role-option" data-target="/dashboard.html" data-color="student">
          <div class="role-option-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </div>
          <div class="role-option-label">لوحة الطالب</div>
          <div class="role-option-desc">شوف دروسك واختباراتك</div>
        </button>

        <button type="button" class="role-option" data-target="/parent.html" data-color="parent">
          <div class="role-option-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
            </svg>
          </div>
          <div class="role-option-label">لوحة ولي الأمر</div>
          <div class="role-option-desc">تابع تقدم أبنائك</div>
        </button>
      </div>

      <button type="button" class="btn btn-ghost" id="backToLoginBtn" style="width:100%;height:40px;margin-top:20px">
        <span>← رجوع</span>
      </button>
    </div>

  </div>

</div>

<a href="/chat.html" class="floating-chat-btn" aria-label="المساعد الذكي">
  <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
  <span class="floating-chat-label">محتاج مساعدة؟</span>
</a>

<script type="module" src="/assets/js/login.js"></script>
<script type="module" src="/assets/js/theme.js"></script>
</body>
</html>
