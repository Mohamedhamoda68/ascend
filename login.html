<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">

<title>تسجيل الدخول — ASCEND</title>
<meta name="description" content="سجّل دخولك إلى منصة ASCEND التعليمية وتابع رحلتك نحو التفوق.">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap">

<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/layout.css">
</head>
<body>

<div class="auth-wrap">

  <div class="auth-card">

    <a href="/" class="brand" style="justify-content:center;margin-bottom:24px;display:flex">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M7 17L17 7M17 7H9M17 7v8"/></svg>
      </span>
      ASCEND
    </a>

    <h1 style="text-align:center">مرحبًا بعودتك</h1>
    <p class="sub" style="text-align:center">سجّل دخولك لمتابعة رحلتك التعليمية</p>

    <div class="alert alert-error" id="alert" role="alert"></div>

    <form id="loginForm" novalidate>

      <div class="field" id="emailField">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
        <div class="error-msg">يرجى إدخال بريد إلكتروني صحيح</div>
      </div>

      <div class="field" id="passwordField">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        <div class="error-msg">كلمة المرور مطلوبة</div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin:16px 0 20px;font-size:13px">
        <label style="display:inline-flex;align-items:center;gap:8px;color:var(--fg-2);cursor:pointer">
          <input type="checkbox" name="remember" style="width:16px;height:16px;accent-color:var(--accent);cursor:pointer">
          تذكّرني
        </label>
        <a href="/forgot-password.html" style="color:var(--accent-fg);font-weight:600;text-decoration:none">نسيت كلمة المرور؟</a>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%;height:44px">
        <span>تسجيل الدخول</span>
      </button>

    </form>

    <div class="auth-foot">
      ليس لديك حساب؟ <a href="/register.html">إنشاء حساب جديد</a>
    </div>

  </div>

</div>

<a href="/chat.html" class="floating-chat-btn" aria-label="المساعد الذكي">
  <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
  <span class="floating-chat-label">محتاج مساعدة؟</span>
</a>

<script type="module">
import { supabase } from '/assets/js/supabase.js';
import { $, toast } from '/assets/js/utils.js';

const form = $('#loginForm');
const alertBox = $('#alert');
const submitBtn = $('#submitBtn');
const emailField = $('#emailField');
const passwordField = $('#passwordField');

/* ---------- Validation ---------- */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function clearErrors() {
  emailField?.classList.remove('has-error');
  passwordField?.classList.remove('has-error');
  alertBox?.classList.remove('show');
}

function showAlert(msg, type = 'error') {
  alertBox.textContent = msg;
  alertBox.className = `alert alert-${type} show`;
}

function setLoading(btn, loading, text) {
  btn.disabled = loading;
  btn.innerHTML = loading
    ? '<span class="spinner"></span><span>جارٍ التحقق…</span>'
    : `<span>${text}</span>`;
}

/* ---------- Submit ---------- */
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearErrors();

  const email = form.email.value.trim();
  const password = form.password.value;

  let valid = true;
  if (!EMAIL_RE.test(email)) { emailField.classList.add('has-error'); valid = false; }
  if (!password || password.length < 6) { passwordField.classList.add('has-error'); valid = false; }
  if (!valid) return;

  setLoading(submitBtn, true);

  try {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      if (error.message.includes('Invalid login')) {
        showAlert('البريد الإلكتروني أو كلمة المرور غير صحيحة.');
      } else if (error.message.includes('Email not confirmed')) {
        showAlert('يرجى تأكيد بريدك الإلكتروني أولًا.');
      } else {
        showAlert('حدث خطأ أثناء تسجيل الدخول. حاول مرة أخرى.');
      }
      setLoading(submitBtn, false, 'تسجيل الدخول');
      return;
    }

    /* ---------- Fetch profile ---------- */
    const { data: profile } = await supabase
      .from('profiles')
      .select('role, status')
      .eq('id', data.user.id)
      .single();

    /* ---------- Redirect based on role ---------- */
    const role = profile?.role || 'student';
    const status = profile?.status || 'pending';

    if (role === 'admin') {
      location.href = '/admin.html';
    } else if (role === 'parent') {
      location.href = '/parent.html';
    } else if (status === 'pending') {
      showAlert('حسابك قيد المراجعة. سيتم تفعيله قريبًا.', 'info');
      await supabase.auth.signOut();
      setLoading(submitBtn, false, 'تسجيل الدخول');
    } else if (status === 'suspended') {
      showAlert('حسابك موقوف. تواصل مع الإدارة.', 'error');
      await supabase.auth.signOut();
      setLoading(submitBtn, false, 'تسجيل الدخول');
    } else {
      location.href = '/dashboard.html';
    }

  } catch (err) {
    console.error('[ASCEND] Login error:', err);
    showAlert('تعذّر الاتصال بالخادم. تحقّق من الإنترنت.');
    setLoading(submitBtn, false, 'تسجيل الدخول');
  }
});

/* ---------- Live validation ---------- */
form.email?.addEventListener('blur', () => {
  if (form.email.value && !EMAIL_RE.test(form.email.value.trim())) {
    emailField.classList.add('has-error');
  } else {
    emailField.classList.remove('has-error');
  }
});

/* ---------- Auto-focus ---------- */
window.addEventListener('load', () => form.email?.focus());
</script>

</body>
</html>
